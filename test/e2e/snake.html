<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#123;color:#fff;font:24px sans-serif;text-align:center}canvas{display:block;margin:0 auto;background:#1b4}button{font:28px sans-serif;padding:14px 28px;margin:8px}</style></head>
<body><div id="ui"><p id="msg">Змейка</p><button id="start">Старт</button></div><canvas id="c" width="300" height="300"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),N=15,S=20;let snake,dir,food,timer,score;
function reset(){snake=[{x:5,y:5}];dir={x:1,y:0};food={x:10,y:10};score=0}
function draw(){x.fillStyle='#1b4';x.fillRect(0,0,300,300);x.fillStyle='#f33';x.fillRect(food.x*S,food.y*S,S,S);x.fillStyle='#fff';snake.forEach(s=>x.fillRect(s.x*S,s.y*S,S-1,S-1))}
function end(win){clearInterval(timer);document.getElementById('msg').textContent=(win?'Победа! ':'Конец игры. ')+'Счёт: '+score;document.getElementById('start').textContent='Играть снова';document.getElementById('ui').style.display='block'}
function tick(){const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x==h.x&&s.y==h.y))return end(false);snake.unshift(h);if(h.x==food.x&&h.y==food.y){score++;if(score>=5)return end(true);food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}else snake.pop();draw()}
document.getElementById('start').onclick=()=>{reset();document.getElementById('ui').style.display='none';draw();timer=setInterval(tick,150)};
addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m)dir={x:m[0],y:m[1]}});
let t0;c.addEventListener('touchstart',e=>t0=e.touches[0]);c.addEventListener('touchend',e=>{const d={x:e.changedTouches[0].clientX-t0.clientX,y:e.changedTouches[0].clientY-t0.clientY};dir=Math.abs(d.x)>Math.abs(d.y)?{x:Math.sign(d.x),y:0}:{x:0,y:Math.sign(d.y)}});
</script></body></html>
