<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Генератор игр по промпту</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Игра по одному предложению</h1>

    <section class="panel">
      <label for="prompt">Опишите игру</label>
      <textarea id="prompt" rows="3" placeholder="Например: замути змейку для бабушки"></textarea>

      <label for="audience">Для кого</label>
      <select id="audience">
        <option value="">Без уточнения</option>
        <option value="kids">Дети</option>
        <option value="adults">Взрослые</option>
        <option value="seniors">Пожилые люди</option>
      </select>

      <button id="generate" type="button">Создать игру</button>
      <p id="status" class="status" role="status"></p>
    </section>

    <section class="panel" id="result" hidden>
      <iframe id="game" sandbox="allow-scripts" title="Сгенерированная игра"></iframe>

      <label for="change">Что доработать</label>
      <div class="row">
        <input id="change" type="text" placeholder="Например: сделай кнопки больше">
        <button id="iterate" type="button">Доработать</button>
      </div>

      <button id="download" type="button" class="secondary">Скачать HTML</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
